<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackhead Quarries — Lee Stream Site Induction</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');

:root{
  --basalt:#23262B;
  --basalt-2:#3A3E46;
  --stone:#6B6F76;
  --limestone:#F3EFE7;
  --card:#FFFFFF;
  --amber:#C97A1F;
  --amber-dark:#9C5E14;
  --red:#A5342A;
  --green:#3F6B4E;
  --line:#DDD8CC;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--limestone);
  font-family:'Source Sans 3',system-ui,sans-serif;
  color:var(--basalt);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:0 0 60px;
}
.app{
  width:100%;
  max-width:560px;
  min-height:100vh;
  background:var(--card);
  display:flex;
  flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,0.08);
}

/* HEADER */
header.top{
  background:var(--basalt);
  color:var(--limestone);
  padding:22px 22px 18px;
  position:relative;
  overflow:hidden;
}
.hex-row{display:flex;gap:6px;margin-bottom:14px;}
.hex{
  width:14px;height:16px;
  background:var(--stone);
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  transition:background .3s;
}
.hex.done{background:var(--amber);}
.hex.current{background:var(--limestone);}
.brand{display:flex;align-items:center;gap:10px;}
.brand svg{width:34px;height:38px;flex:none;}
.logo-img{height:34px;width:auto;background:#fff;padding:5px 9px;border-radius:5px;flex:none;}
.brand-text .co{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:1.15rem;
  letter-spacing:0.04em;
  text-transform:uppercase;
  line-height:1.1;
}
.brand-text .site{
  font-size:0.78rem;
  color:#C9C2AF;
  letter-spacing:0.06em;
  text-transform:uppercase;
}

/* CONTENT */
main{
  flex:1;
  padding:26px 22px 10px;
}
.eyebrow{
  font-family:'Oswald',sans-serif;
  font-size:0.72rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--amber-dark);
  font-weight:600;
  margin-bottom:6px;
}
h1.section-title{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:1.55rem;
  margin:0 0 16px;
  border-bottom:3px solid var(--amber);
  padding-bottom:10px;
  display:inline-block;
}
p{line-height:1.55;font-size:0.98rem;margin:0 0 14px;}
ul{margin:0 0 14px;padding-left:1.2em;}
li{line-height:1.5;margin-bottom:6px;}
.callout{
  border-left:4px solid var(--red);
  background:#FBEFEC;
  padding:12px 14px;
  border-radius:6px;
  font-size:0.93rem;
  margin:14px 0;
}
.callout.amber{border-left-color:var(--amber);background:#FBF1E2;}
.callout strong{display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:0.75rem;letter-spacing:0.06em;margin-bottom:4px;}
.confirm-tag{
  display:inline-block;
  font-family:'Oswald',sans-serif;
  font-size:0.65rem;
  letter-spacing:0.05em;
  text-transform:uppercase;
  background:var(--amber);
  color:#fff;
  padding:2px 7px;
  border-radius:3px;
  margin-left:6px;
  vertical-align:middle;
}
.ppe-row{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap;}
.ppe{
  width:64px;height:64px;border-radius:50%;
  background:var(--basalt-2);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:0.62rem;text-align:center;line-height:1.15;
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;
  padding:4px;
}
figure{margin:16px 0;}
figcaption{font-size:0.8rem;color:var(--stone);margin-top:6px;text-align:center;}

/* FORM FIELDS */
label.field-label{
  display:block;font-family:'Oswald',sans-serif;font-size:0.78rem;
  letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;color:var(--basalt-2);
}
input[type=text],input[type=date],select{
  width:100%;padding:11px 12px;font-size:1rem;border:1.5px solid var(--line);
  border-radius:6px;margin-bottom:18px;font-family:inherit;background:#fff;
}
input:focus,select:focus{outline:2px solid var(--amber);border-color:var(--amber);}
.check-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
.check-row input{margin-top:3px;flex:none;width:18px;height:18px;}
.check-row label{font-size:0.92rem;line-height:1.45;}

/* NAV */
nav.foot{
  display:flex;justify-content:space-between;gap:12px;
  padding:16px 22px 24px;border-top:1px solid var(--line);
}
button{
  font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.03em;
  text-transform:uppercase;font-size:0.85rem;
  padding:13px 22px;border-radius:6px;border:none;cursor:pointer;
  transition:opacity .15s, transform .1s;
}
button:active{transform:scale(0.98);}
.btn-back{background:#EDE9E0;color:var(--basalt);}
.btn-next{background:var(--amber);color:#fff;}
.btn-next:disabled{background:#D9C9AC;cursor:not-allowed;}
.btn-next:hover:not(:disabled){background:var(--amber-dark);}

/* MAP SVG */
.mapwrap{border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:#EDE7D8;}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;font-size:0.82rem;margin-top:12px;align-items:center;}
.legend .sw{width:26px;height:14px;border-radius:2px;}

/* DONE SCREEN */
.done-wrap{text-align:center;padding:30px 10px;}
.done-wrap .hexbig{width:70px;height:80px;margin:0 auto 18px;background:var(--green);
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  display:flex;align-items:center;justify-content:center;}
.done-wrap .hexbig svg{width:34px;height:34px;fill:#fff;}
.ref{font-family:'Oswald',sans-serif;letter-spacing:0.05em;background:var(--limestone);
  border:1px dashed var(--stone);padding:10px 16px;border-radius:6px;display:inline-block;margin-top:14px;}

@media (max-width:400px){
  main{padding:22px 16px 6px;}
  header.top{padding:18px 16px 14px;}
}
</style>
</head>

      <h1 class="section-title">Site &amp; General Rules</h1>
      <p>Lee Stream is a working quarry face. Rock is cut, broken down and moved by heavy machinery, and trucks can move in and out throughout the day. Treat the whole site as a live workface at all times.</p>
      <ul>
        <li>Everyone operating machinery must hold the appropriate licence.</li>
        <li>No alcohol or drugs on site. Anyone affected will be removed from site immediately.</li>
        <li>Report all accidents and incidents to the site supervisor as soon as practicable, no matter how minor.</li>
        <li>Speed limits apply on the access road — 30km/h — and must be followed at all times, including past any nearby houses.</li>

    render: () => `
      <div class="done-wrap">
        <div class="hexbig"><svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.5-1.5z"/></svg></div>
        <h1 class="section-title" style="border:none;">Induction complete</h1>
        <p>Thanks, ${state.name || 'there'} — you're cleared to enter the Lee Stream site.</p>
        <p>You still need to sign in and out on site each time you're on site.</p>
        <div class="ref">Ref: ${state.refCode || ''}</div>
        ${state.submitError ? `<div class="callout" style="text-align:left;margin-top:14px;"><strong>Record not saved</strong>Your details couldn't be sent — check your connection and let the site supervisor know in person.</div>` : ''}
        <a href="https://www.visitor.app" target="_blank" rel="noopener" style="text-decoration:none;">
          <button class="btn-next" style="margin-top:22px;width:100%;">Sign in on site →</button>
        </a>
        <div class="callout amber" style="margin-top:14px;text-align:left;">
          <strong>Code to enter</strong>
          MEWNYM
        </div>
      </div>
    `
  }
];

let idx = 0;

function fieldsValidOnAck(){
  const name = document.getElementById('f-name')?.value.trim();
  const phone = document.getElementById('f-phone')?.value.trim();
  const sig = document.getElementById('f-sig')?.value.trim();
  const c1 = document.getElementById('c1')?.checked;
  const c2 = document.getElementById('c2')?.checked;
  const c3 = document.getElementById('c3')?.checked;
  return name && phone && sig && c1 && c2 && c3 && state.photo;
}

function syncAckState(){
  if(pages[idx].id !== 'ack') return;
  state.name = document.getElementById('f-name').value;
  state.role = document.getElementById('f-role').value;
  state.phone = document.getElementById('f-phone').value;
  state.date = document.getElementById('f-date').value;
  state.ack1 = document.getElementById('c1').checked;
  state.ack2 = document.getElementById('c2').checked;
  state.ack3 = document.getElementById('c3').checked;
  state.signature = document.getElementById('f-sig').value;
}

const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyVt07IaUac1U8RKzt0qDfl59pe9qNrAd_4AmsQWmir9zz9W25i0XGej9gvQwwwFXmvrw/exec";

async function submitInduction(){
  state.refCode = 'LS-' + Date.now().toString().slice(-6);
  try{
    await fetch(SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // avoids CORS preflight with Apps Script
      body: JSON.stringify({
        refCode: state.refCode,
        name: state.name,
        role: state.role,
        phone: state.phone,
        date: state.date,
        signature: state.signature,
        photo: state.photo
      })
    });
    state.submitError = false;
  }catch(e){
    console.error('Could not save induction record', e);
    state.submitError = true;
  }
}

const flowIds = ['welcome','overview','ppe','loader','traffic','leaving','emergency','ack'];

function render(){
  const app = document.getElementById('app');
  const p = pages[idx];
  const flowPos = flowIds.indexOf(p.id);
  const hexes = flowPos === -1 ? '' : Array.from({length: flowIds.length}).map((_,i)=>{
    let cls = '';
    if(i < flowPos) cls = 'done';
    else if(i === flowPos) cls = 'current';
    return `<div class="hex ${cls}"></div>`;
  }).join('');

  const isTitle = p.id === 'title';
  const isDone = p.id === 'done';
  const isAck = p.id === 'ack';
  const hideNav = isTitle || isDone;

  app.innerHTML = `
    <header class="top">
      <div class="hex-row">${hexes}</div>
      <div class="brand">
        <img src="data:image/png;base64,${LOGO_B64}" alt="Blackhead Quarries Ltd" class="logo-img">
        <div class="brand-text">
          <div class="site">Lee Stream Site Induction</div>
        </div>
      </div>
    </header>
    <main style="${isTitle?'padding-top:0;':''}">${p.render()}</main>
    ${hideNav ? '' : `
      <nav class="foot">
        <button class="btn-back" onclick="goBack()">Back</button>
        <button class="btn-next" id="next-btn" onclick="goNext()">${isAck ? 'Submit induction' : 'Next'}</button>
      </nav>
    `}
  `;

  if(isAck){
    const nextBtn = document.getElementById('next-btn');
    const update = () => { nextBtn.disabled = !fieldsValidOnAck(); };
    ['f-name','f-phone','f-sig','c1','c2','c3'].forEach(id=>{
      document.getElementById(id).addEventListener('input', update);
      document.getElementById(id).addEventListener('change', update);
    });
    document.getElementById('photo-btn').addEventListener('click', () => {
      document.getElementById('f-photo-input').click();
    });
    document.getElementById('f-photo-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.photo = reader.result;
        syncAckState();
        render();
      };
      reader.readAsDataURL(file);
    });
    update();
  }
}

function goBack(){
  syncAckState();
  idx = Math.max(0, idx-1);
  render();
}

async function goNext(){
  if(pages[idx].id === 'ack'){
    syncAckState();
    if(!fieldsValidOnAck()) return;
    await submitInduction();
  }
  idx = Math.min(pages.length-1, idx+1);
  render();
}

function goToInduction(){
  idx = pages.findIndex(pg => pg.id === 'welcome');
  render();
}

render();
</script>
</body>
</html>
